name: Release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: for file in static/*.js lib/*.js api/*.js tools/*.js; do node --check "$file"; done
      - run: npm audit --omit=dev --audit-level=high
      - run: node tools/build.js
