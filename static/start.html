<!doctype html>
<html lang="en">
<head>

<body>

      <div class="narrow"><div class="progress" aria-hidden="true"><i id="bar"></i></div></div>
    </div>

    <main class="flow-body">
      <div class="narrow" id="screen" aria-live="polite"></div>
      <noscript><div class="narrow note">this page needs javascript. you can also write to desk@hamzury.com.</div></noscript>
    </main>

    <div class="flow-bottom" id="bottom" hidden>
      <div class="narrow"><button class="btn btn-primary" type="button" id="nextBtn">continue</button></div>
    </div>
  </div>
